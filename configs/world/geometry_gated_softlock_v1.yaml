# TMM method-extension campaign. No holdout metric is used for checkpoint
# selection; all novel-light frames remain evaluation-only.
output_root: outputs/geometry_gated_softlock_v1
protocol_label: Ours-NoGT-softlock-robustPS
image_scale: 0.25
n_gaussians: 50000
raster_backend: gsplat
lighting_mode: sh
use_refiner: false
shadow_mode: none
views_per_step: 4
scene_lr: 0.002
light_lr: 0.0005
checkpoint_every: 1000
short_steps: 3000
final_steps: 6000
brdf_warm_start_densify: true
brdf_material_steps: 3000
photometric_stereo_max_views: 8

# Multi-resolution, surface-aware geometry.
visual_hull_resolution: 96
visual_hull_coarse_resolution: 32
stanford_visual_hull_min_view_fraction: 0.9
stanford_visual_hull_normal_smoothing_kernel: 3

# Soft source-view locking.
view_lock_mode: soft
view_lock_temperature: 0.55
view_lock_min_weight: 0.02

# Robust image-space photometric stereo.
image_ps_irls_iterations: 3
image_ps_huber_delta: 1.5
image_ps_shadow_threshold: 0.01
image_ps_saturation_threshold: 0.98

diligent_image_scale: 0.5
diligent_photometric_stereo_max_views: 20
diligent_scene_lr: 0.001
diligent_world_ps_surface: false
diligent_world_ps_initializer: hull
diligent_image_normal_prior_weight: 0.5
diligent_normal_lr: 0.005
diligent_holdout_light_stride: 8
diligent_holdout_light_offset: 0
diligent_n_gaussians: 50000
diligent_image_ps_lower_quantile: 0.15
diligent_image_ps_upper_quantile: 0.50
normal_prior: 1.0
seed_from: outputs/geometry_gated_clean_split_final
seed_scenes:
  - ball_scene003
  - gnome_scene003
brdf_refine_scenes:
  - ball_scene003
  - gnome_scene003

gate_thresholds:
  stanford_normal_cosine_max: 0.28
  stanford_depth_mse_x1e3_max: 1.10
  stanford_psnr_min: 21.0
  stanford_teapot_psnr_min: 15.0
  stanford_blocks_ncos_max: 0.38
  diligent_normal_degrees_max: 19.0
  diligent_reading_psnr_min: 22.0
  diligent_cow_psnr_min: 26.91

stanford_root: data/external/stanford_orb/blender_LDR
stanford_ground_truth: data/external/stanford_orb/ground_truth
stanford_scenes:
  - ball_scene003
  - blocks_scene005
  - gnome_scene003
  - teapot_scene002

diligent_root: data/external/diligent_mv/DiLiGenT-MV/mvpmsData
diligent_scenes:
  - cowPNG
  - readingPNG

scene_overrides:
  ball_scene003:
    visual_hull_resolution: 96
    visual_hull_coarse_resolution: 0
    loss:
      depth_smooth: 0.03
      normal_edge_aware: 0.04
      normal_planar: 0.04
  blocks_scene005:
    visual_hull_resolution: 128
    visual_hull_coarse_resolution: 40
    visual_hull_min_view_fraction: 0.8
    visual_hull_normal_smoothing_kernel: 5
    keep_learned_normals: false
    brdf_geometry_stage: coupled
    brdf_geometry_checkpoint: outputs/geometry_gated_softlock_v1/stanford_orb/blocks_scene005/coupled/last.pt
    geometry_steps: 2000
    loss:
      normal_smooth: 0.0
      normal_edge_aware: 0.10
      normal_planar: 0.10
      normal_axis: 0.12
      silhouette_bce: 0.28
      silhouette_dice: 0.28
  teapot_scene002:
    visual_hull_resolution: 96
    visual_hull_coarse_resolution: 0
    freeze_geometry_except_opacity: true
    brdf_freeze_geometry: true
    brdf_geometry_stage: coupled
    brdf_geometry_checkpoint: outputs/geometry_gated_softlock_v1/stanford_orb/teapot_scene002/coupled/last.pt
    brdf_freeze_lighting: true
    brdf_material_steps: 4000
    scene_lr: 0.0015
    light_lr: 0.005
    loss:
      background_leak: 0.25
      silhouette_bce: 0.30
      silhouette_dice: 0.30
      photo_ssim: 0.15
      normal_edge_aware: 0.04
      normal_planar: 0.04
  cowPNG:
    view_lock_mode: hard
    view_lock_neighbors: 1
    image_ps_hull_resolution: 64
    brdf_freeze_geometry: true
    brdf_geometry_checkpoint: outputs/cow_hardlock_brdf_control/diligent_mv/cowPNG/brdf/last.pt
    brdf_material_steps: 1500
  readingPNG:
    view_lock_mode: hard
    image_ps_irls_iterations: 0
    image_ps_shadow_threshold: 0.0
    image_ps_saturation_threshold: 1.0
    view_lock_neighbors: 1
    image_ps_hull_resolution: 64
    brdf_freeze_geometry: true
    brdf_geometry_checkpoint: outputs/reading_hardlock_corrected_probe/diligent_mv/readingPNG/coupled/last.pt
    brdf_material_steps: 1500
    optimize_sensors_only: true
    scene_lr: 0.0012
    light_lr: 0.005
    loss:
      material_smooth: 0.012
      normal_prior: 1.2
      photo_l1: 1.2

loss:
  photo_l1: 1.0
  photo_ssim: 0.2
  photo_log: 0.0
  photo_highlight: 0.0
  albedo_gt: 0.0
  normal_gt: 0.0
  depth_gt: 0.0
  depth_prior: 0.0
  silhouette_bce: 0.2
  silhouette_dice: 0.2
  background_leak: 0.1
  depth_smooth: 0.02
  normal_smooth: 0.0
  normal_edge_aware: 0.05
  normal_planar: 0.05
  exposure_prior: 0.001
  white_balance_prior: 0.001
  energy: 0.1
  material_smooth: 0.02
  normal_axis: 0.05
  scale: 0.001
  opacity_sparse: 0.001
  texture_consistency: 0.02
