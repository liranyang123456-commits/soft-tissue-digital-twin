data_type: stanford_orb
protocol_label: Ours-GT
data_root: data/external/stanford_orb/blender_LDR/ball_scene003
ground_truth_root: data/external/stanford_orb/ground_truth
source_is_linear: false
image_scale: 0.25
use_dataset_split: true

n_gaussians: 50000
use_mesh_points: true
max_init_points: 50000
freeze_geometry: true
optimize_normals: false

lighting_mode: sh
linear_hdr: false
shadow_mode: none
use_refiner: false
raster_backend: gsplat

steps: 3000
views_per_step: 4
view_sampling: distinct_views
scene_lr: 0.002
light_lr: 0.0005
checkpoint_every: 1000
output_dir: outputs/optimization_probe/stanford_ball_scene003

loss:
  photo_l1: 1.0
  photo_ssim: 0.2
  albedo_gt: 0.0
  normal_gt: 0.0
  depth_gt: 0.0
  exposure_prior: 0.001
  white_balance_prior: 0.001
  energy: 0.1
  material_smooth: 0.02
  normal_axis: 0.0
  scale: 0.0
  opacity_sparse: 0.0
  texture_consistency: 0.02
