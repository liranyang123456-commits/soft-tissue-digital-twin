data_type: blender
data_root: data/world_demo
transforms: transforms.json
image_scale: 0.25

n_gaussians: 512
lighting_mode: neilf            # full Li(x, wi) incident field
use_refiner: true
refiner_base: 96
shiq_refiner_checkpoint: outputs/shiq_mse/best.pt
chunk_size: 32
raster_backend: auto

steps: 5000
refine_start: 3000
scene_lr: 0.001
light_lr: 0.0005
neilf_lr: 0.0001
refiner_lr: 0.00005
log_every: 25
output_dir: outputs/world_neilf

loss:
  photo_l1: 1.0
  photo_ssim: 0.2
  diffuse_gt: 1.0
  refine_gt: 1.0
  specular_gt: 0.5
  energy: 0.1
  material_smooth: 0.03
  normal_axis: 0.02
  scale: 0.005
  opacity_sparse: 0.001
  texture_consistency: 0.02

